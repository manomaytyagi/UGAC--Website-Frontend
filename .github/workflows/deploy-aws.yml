name: Deploy to AWS ECS Express Mode

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-aws.yml"

permissions:
  id-token: write   # OIDC token for aws-actions/configure-aws-credentials
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ugac-backend
  ECS_SERVICE: ugac-backend-310b
  ECS_CLUSTER: default

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        id: current-task-definition
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].deployments[?status=='PRIMARY'] | [0].taskDefinition" \
            --output text)
          test -n "$TASK_DEFINITION" && test "$TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json
          CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' task-definition.json)
          test -n "$CONTAINER_NAME" && test "$CONTAINER_NAME" != "null"
          echo "container_name=$CONTAINER_NAME" >> $GITHUB_OUTPUT

      - name: Render updated task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.current-task-definition.outputs.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
